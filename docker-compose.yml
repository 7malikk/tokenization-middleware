# Full stack: vault database, middleware, reference app and its database.
#
#   docker compose run --rm setup    # once: certificates, KEK, key file, reference credential
#   docker compose up -d
#
# Networks: vault-net joins only the middleware and its database (and the
# one-shot migrate/setup jobs). app-net joins the middleware, reference app and
# reference database. The reference app therefore has no route to vault-db.
#
# Database ports are not published. For debugging or running the test suites
# against these databases, add docker-compose.db-ports.yml.

name: tokenization

x-vault-database-url: &vault-database-url
  DATABASE_URL: postgresql://${VAULT_DB_USER:-vault}:${VAULT_DB_PASSWORD:-vault}@vault-db:5432/vault?schema=vault

x-reference-database-url: &reference-database-url
  DATABASE_URL: postgresql://${REFERENCE_DB_USER:-reference}:${REFERENCE_DB_PASSWORD:-reference}@reference-db:5432/reference?schema=public

services:
  vault-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${VAULT_DB_USER:-vault}
      POSTGRES_PASSWORD: ${VAULT_DB_PASSWORD:-vault}
      POSTGRES_DB: vault
    volumes:
      - vault-pgdata:/var/lib/postgresql/data
    networks: [vault-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    image: tokenization-middleware-migrate:latest
    environment:
      <<: *vault-database-url
    networks: [vault-net]
    depends_on:
      vault-db: { condition: service_healthy }
    restart: "no"

  setup:
    build: { context: ., target: setup }
    image: tokenization-middleware-setup:latest
    profiles: [setup]
    environment:
      <<: *vault-database-url
    volumes:
      - ${SECRETS_DIR:-./secrets}:/secrets
      - ${KEYS_DIR:-./keys}:/keys
    networks: [vault-net]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  middleware:
    build: { context: ., target: runtime }
    image: tokenization-middleware:latest
    environment:
      <<: *vault-database-url
      PORT: "3000"
      TLS_CERT_PATH: /run/secrets/tls_cert
      TLS_KEY_PATH: /run/secrets/tls_key
      MASTER_KEK_FILE: /run/secrets/master_kek
      MASTER_KEY_FILE: /keys/master-keys.json
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [tls_cert, tls_key, master_kek]
    volumes:
      - ${KEYS_DIR:-./keys}:/keys:ro
    ports:
      - "${MIDDLEWARE_BIND:-127.0.0.1}:${MIDDLEWARE_PORT:-3000}:3000"
    networks: [vault-net, app-net]
    depends_on:
      vault-db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  reference-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${REFERENCE_DB_USER:-reference}
      POSTGRES_PASSWORD: ${REFERENCE_DB_PASSWORD:-reference}
      POSTGRES_DB: reference
    volumes:
      - reference-pgdata:/var/lib/postgresql/data
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  reference-migrate:
    build: { context: ./reference-app, target: migrate }
    image: tokenization-reference-migrate:latest
    environment:
      <<: *reference-database-url
    networks: [app-net]
    depends_on:
      reference-db: { condition: service_healthy }
    restart: "no"

  reference-app:
    build: { context: ./reference-app, target: runtime }
    image: tokenization-reference-app:latest
    environment:
      <<: *reference-database-url
      PORT: "8080"
      MIDDLEWARE_URL: https://middleware:3000
      MIDDLEWARE_CA_PATH: /run/secrets/tls_cert
      REFERENCE_API_KEY_FILE: /run/secrets/reference_api_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [tls_cert, reference_api_key]
    ports:
      - "${REFERENCE_BIND:-127.0.0.1}:${REFERENCE_PORT:-8080}:8080"
    networks: [app-net]
    depends_on:
      reference-db: { condition: service_healthy }
      reference-migrate: { condition: service_completed_successfully }
      middleware: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  vault-net:
    internal: true
  app-net: {}

volumes:
  vault-pgdata:
  reference-pgdata:

secrets:
  tls_cert:
    file: ${SECRETS_DIR:-./secrets}/tls-cert.pem
  tls_key:
    file: ${SECRETS_DIR:-./secrets}/tls-key.pem
  master_kek:
    file: ${SECRETS_DIR:-./secrets}/master-kek
  reference_api_key:
    file: ${SECRETS_DIR:-./secrets}/reference-api-key
