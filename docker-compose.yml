# Full stack: vault database, middleware, reference app and its database.
#
#   docker compose run --rm setup        # once: certificates, KEK, key file, database passwords
#   docker compose run --rm setup-vault  # once: the reference app's credential
#   docker compose up -d
#
# Networks: vault-net joins only the middleware and its database (and the
# one-shot migrate/setup jobs). app-net joins the middleware, reference app and
# reference database. The reference app therefore has no route to vault-db.
#
# Database passwords are generated by setup and passed only as Compose secrets.
# Services build their database URL from the secret at startup, so no
# password appears in this file, in env files, in images or in logs.
#
# Database ports are not published. For debugging or running the test suites
# against these databases, add docker-compose.db-ports.yml.

name: tokenization

x-vault-database: &vault-database
  DATABASE_HOST: vault-db
  DATABASE_NAME: vault
  DATABASE_USER: vault
  DATABASE_SCHEMA: vault
  DATABASE_PASSWORD_FILE: /run/secrets/vault_db_password

x-reference-database: &reference-database
  DATABASE_HOST: reference-db
  DATABASE_NAME: reference
  DATABASE_USER: reference
  DATABASE_SCHEMA: public
  DATABASE_PASSWORD_FILE: /run/secrets/reference_db_password

services:
  vault-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD_FILE: /run/secrets/vault_db_password
      POSTGRES_DB: vault
    secrets: [vault_db_password]
    volumes:
      - vault-pgdata:/var/lib/postgresql/data
    networks: [vault-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build: { context: ./middleware, target: migrate }
    image: tokenization-middleware-migrate:latest
    environment:
      <<: *vault-database
    secrets: [vault_db_password]
    networks: [vault-net]
    depends_on:
      vault-db: { condition: service_healthy }
    restart: "no"

  # Step 1: writes every secret file. No database (none can start without its password).
  setup:
    build: { context: ./middleware, target: setup }
    image: tokenization-middleware-setup:latest
    profiles: [setup]
    command: ["secrets"]
    volumes:
      - ${SECRETS_DIR:-./secrets}:/secrets
      - ${KEYS_DIR:-./keys}:/keys
    network_mode: none
    restart: "no"

  # Step 2, and `rotate`: tasks that need the migrated vault database.
  setup-vault:
    build: { context: ./middleware, target: setup }
    image: tokenization-middleware-setup:latest
    profiles: [setup]
    command: ["vault"]
    environment:
      <<: *vault-database
      DATABASE_PASSWORD_FILE: /secrets/vault-db-password
    volumes:
      - ${SECRETS_DIR:-./secrets}:/secrets
      - ${KEYS_DIR:-./keys}:/keys
    networks: [vault-net]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  middleware:
    build: { context: ./middleware, target: runtime }
    image: tokenization-middleware:latest
    environment:
      <<: *vault-database
      PORT: "3000"
      TLS_CERT_PATH: /run/secrets/tls_cert
      TLS_KEY_PATH: /run/secrets/tls_key
      MASTER_KEK_FILE: /run/secrets/master_kek
      MASTER_KEY_FILE: /keys/master-keys.json
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [tls_cert, tls_key, master_kek, vault_db_password]
    volumes:
      - ${KEYS_DIR:-./keys}:/keys:ro
    ports:
      - "${MIDDLEWARE_BIND:-127.0.0.1}:${MIDDLEWARE_PORT:-3000}:3000"
    networks: [vault-net, app-net]
    depends_on:
      vault-db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  reference-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reference
      POSTGRES_PASSWORD_FILE: /run/secrets/reference_db_password
      POSTGRES_DB: reference
    secrets: [reference_db_password]
    volumes:
      - reference-pgdata:/var/lib/postgresql/data
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20

  reference-migrate:
    build: { context: ./reference_app, target: migrate }
    image: tokenization-reference-migrate:latest
    environment:
      <<: *reference-database
    secrets: [reference_db_password]
    networks: [app-net]
    depends_on:
      reference-db: { condition: service_healthy }
    restart: "no"

  reference-app:
    build: { context: ./reference_app, target: runtime }
    image: tokenization-reference-app:latest
    environment:
      <<: *reference-database
      PORT: "8080"
      MIDDLEWARE_URL: https://middleware:3000
      MIDDLEWARE_CA_PATH: /run/secrets/tls_cert
      REFERENCE_API_KEY_FILE: /run/secrets/reference_api_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [tls_cert, reference_api_key, reference_db_password]
    ports:
      - "${REFERENCE_BIND:-127.0.0.1}:${REFERENCE_PORT:-8080}:8080"
    networks: [app-net]
    depends_on:
      reference-db: { condition: service_healthy }
      reference-migrate: { condition: service_completed_successfully }
      middleware: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  vault-net:
    internal: true
  app-net: {}

volumes:
  vault-pgdata:
  reference-pgdata:

secrets:
  tls_cert:
    file: ${SECRETS_DIR:-./secrets}/tls-cert.pem
  tls_key:
    file: ${SECRETS_DIR:-./secrets}/tls-key.pem
  master_kek:
    file: ${SECRETS_DIR:-./secrets}/master-kek
  reference_api_key:
    file: ${SECRETS_DIR:-./secrets}/reference-api-key
  vault_db_password:
    file: ${SECRETS_DIR:-./secrets}/vault-db-password
  reference_db_password:
    file: ${SECRETS_DIR:-./secrets}/reference-db-password
